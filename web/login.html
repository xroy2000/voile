<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connexion — Offshore Racing</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="card">
  <div class="brand"><a href="/">⛵ Offshore Racing</a></div>
  <h1>Connexion</h1>
  <p>Accès réservé aux joueurs invités.</p>
  <form id="f" autocomplete="on">
    <label for="pseudo">Pseudo</label>
    <input id="pseudo" name="username" autocomplete="username" required maxlength="20" autofocus>
    <label for="pw">Mot de passe</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <button class="primary" id="go" type="submit">Se connecter</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="foot">Mot de passe perdu ? Demande un nouveau lien à l’organisateur.<br><a href="/">← Retour au simulateur</a></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
  $('go').disabled = true;
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pseudo: $('pseudo').value, password: $('pw').value }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Connexion impossible');
    location.href = '/';
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message;
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
