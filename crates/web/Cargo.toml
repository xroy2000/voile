[package]
name = "regatta-web"
version = "0.1.0"
edition = "2021"
description = "Liaison WebAssembly du simulateur de course au large"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regatta-core = { path = "../core" }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
